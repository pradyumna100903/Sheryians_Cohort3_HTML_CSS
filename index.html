<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon UI </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="left-panel">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" alt="Pokemon-logo" class="pokemon-logo">
        
        <div class="content">


            <p class="generation">

                POKEMON GEN I 
                
            </p>
            <h1> Pikachu </h1>

            <p class="desc">
                
                Pikachu is an Electric-Type Pokemon introduced in Generation I. 
                Pikachu are small , chubby , and incredibly cute mouse-like Pokemon. 
                They are almost completely covered by yellow fur. 
                
            </p>



            <div class="slide-count">

                <span class="line"></span>

                <span>01/08</span>

            
            
            </div>
         </div>

       <img src="./pokemonball.png" alt="pokeball" class="pokeball">
        
    </div>


        <div class="right-panel">


            <div class="menu-icon">

                
                <span></span>
                <span></span>
                <span></span>
            
            </div>




            <img src="./Pikachu.png"  alt="Pikachu"  class="pikachu" >


             <div class="slider-dots">

        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>

          </div>


        </div>


    </div>
    
</body>
</html>
