<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="NFT Artwork Gallery UI Clone">
  <title>NFT Gallery</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <section class="gallery-section">

    <div class="top-bar">
      <h2>Explore Art Work</h2>
      <a href="#">See All</a>
    </div>

    <div class="gallery-grid">

      
      <div class="card">
        <img src="assets/deadpool.jpg" alt="Deadpool image">
        
        <div class="card-info">
          <div class="title-row">
            <h3>Deadpool</h3>
            <span>54.8k ♡</span>
          </div>

          <button>Place Bid</button>
        </div>
      </div>

      
      <div class="card">
        <img src="assets/IronMan.jpg" alt="Irommab">

        <div class="card-info">
          <div class="title-row">
            <h3>Iron Man </h3>
            <span>32.4k ♡</span>
          </div>

          <button>Place Bid</button>
        </div>
      </div>

      
      <div class="card">
        <img src="assets/antman.jpg" alt="Antman">

        <div class="card-info">
          <div class="title-row">
            <h3>Antman</h3>
            <span>8.8k ♡</span>
          </div>

          <button>Place Bid</button>
        </div>
      </div>

      
      <div class="card">
        <img src="assets/Captain_America.jpg" alt="CaptainAmerica">

        <div class="card-info">
          <div class="title-row">
            <h3>Captain America </h3>
            <span>78.9k ♡</span>
          </div>

          <button>Place Bid</button>
        </div>
      </div>

      
      <div class="card">
        <img src="assets/Spiderman.jpg" alt="Spiderman NFT">

        <div class="card-info">
          <div class="title-row">
            <h3>Spiderman</h3>
            <span>24.8k ♡</span>
          </div>

          <button>Place Bid</button>
        </div>
      </div>

      
      <div class="card">
        <img src="assets/deadpool.jpg" alt="Deadpool NFT">

        <div class="card-info">
          <div class="title-row">
            <h3>DeadPool</h3>
            <span>59.7k ♡</span>
          </div>

          <button>Place Bid</button>
        </div>
      </div>

      
      <div class="card">
        <img src="assets/Thanos.jpg" alt="Thanos Img">

        <div class="card-info">
          <div class="title-row">
            <h3>Thanos </h3>
            <span>45.7k ♡</span>
          </div>

          <button>Place Bid</button>
        </div>
      </div>

      
      <div class="card">
        <img src="assets/ninja.jpg" alt="Ninja ">

        <div class="card-info">
          <div class="title-row">
            <h3> Ninja </h3>
            <span>98.6k ♡</span>
          </div>
          <button>Place Bid</button>
        </div>
      </div>

    </div>

  </section>

</body>
</html>
